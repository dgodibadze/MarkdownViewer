name: windows

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generated Windows template is in sync
        shell: bash
        run: |
          python windows/regen-template.py
          git diff --exit-code -- windows/Resources/template.html

      - name: Build (build.ps1 -Publish -Arch ${{ matrix.arch }})
        shell: pwsh
        working-directory: windows
        run: ./build.ps1 -Publish -Arch ${{ matrix.arch }}

      - name: Validate the published bundle
        shell: pwsh
        working-directory: windows
        run: |
          $exePath = (Resolve-Path dist/MarkdownViewer.exe).Path
          if ((Get-Item $exePath).Length -lt 1MB) { throw "MarkdownViewer.exe is suspiciously small" }
          foreach ($f in 'Resources/template.html', 'Resources/marked.min.js', 'Resources/mermaid.min.js', 'Resources/katex.min.js') {
            if (-not (Test-Path (Join-Path dist $f))) { throw "Missing from dist: $f" }
          }
          # PE header: the exe must really be built for the requested CPU.
          $b = [IO.File]::ReadAllBytes($exePath)
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          $want = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          if ($machine -ne $want) { throw ('PE machine 0x{0:X4}, expected 0x{1:X4}' -f $machine, $want) }
          Write-Host ('MarkdownViewer.exe machine type 0x{0:X4} OK for ${{ matrix.arch }}' -f $machine)
          Get-ChildItem dist -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-windows-${{ matrix.arch }}
          path: |
            windows/MarkdownViewer-windows-${{ matrix.arch }}.zip
            windows/MarkdownViewer-windows-${{ matrix.arch }}.zip.sha256

  release:
    # Tags only. Tags containing '-' (v2.2-rc1) are published as prereleases,
    # which the installer's "latest release" lookup ignores.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MarkdownViewer-windows-*
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* $pre \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md

  install-smoke:
    # Runs the real one-line installer (Windows PowerShell 5.1, like a user's
    # console) against this branch and launches the installed app.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.ps1 (source build of this ref)
        shell: powershell
        env:
          MARKDOWNVIEWER_REF: ${{ github.ref_name }}
        run: ./install.ps1

      - name: Installed app launches and stays up
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\MarkdownViewer'
          foreach ($f in 'MarkdownViewer.exe', 'Resources\template.html') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after install: $f" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'MarkdownViewer.lnk'
          if (-not (Test-Path $lnk)) { throw 'Start Menu shortcut missing' }
          $md = Join-Path $env:RUNNER_TEMP 'smoke.md'
          Set-Content $md "# Smoke test`n`n| a | b |`n|---|---|`n| 1 | 2 |"
          $p = Start-Process (Join-Path $dir 'MarkdownViewer.exe') -ArgumentList "`"$md`"" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "MarkdownViewer exited early with code $($p.ExitCode)" }
          Write-Host "Running after 15s: pid $($p.Id), window title '$($p.MainWindowTitle)'"
          Stop-Process $p -Force
