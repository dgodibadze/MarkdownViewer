name: windows

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach assets on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generated Windows template is in sync
        shell: bash
        run: |
          python windows/regen-template.py
          git diff --exit-code -- windows/Resources/template.html

      - name: Build (build.ps1 -Publish)
        shell: pwsh
        working-directory: windows
        run: ./build.ps1 -Publish

      - name: Validate the published bundle
        shell: pwsh
        working-directory: windows
        run: |
          $exe = Get-Item dist/MarkdownViewer.exe
          if ($exe.Length -lt 1MB) { throw "MarkdownViewer.exe is suspiciously small ($($exe.Length) bytes)" }
          foreach ($f in 'Resources/template.html', 'Resources/marked.min.js', 'Resources/mermaid.min.js', 'Resources/katex.min.js') {
            if (-not (Test-Path (Join-Path dist $f))) { throw "Missing from dist: $f" }
          }
          Get-ChildItem dist -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($PWD.Path.Length + 1) }

      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-windows-x64
          path: |
            windows/MarkdownViewer-windows-x64.zip
            windows/MarkdownViewer-windows-x64.zip.sha256

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            windows/MarkdownViewer-windows-x64.zip `
            windows/MarkdownViewer-windows-x64.zip.sha256 `
            --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
